[workspace]
resolver = "2"
members = [
  "d2b-audit",
  "d2b-broker",
  "d2b-bus",
  "d2b-contracts",
  "d2b-contracts-broker",
  "d2b-contracts-control",
  "d2b-contracts-provider",
  "d2b-contracts-resource",
  "d2b-contracts-zone-session",
  "d2b-controller-toolkit",
  "d2b-core",
  "d2b-core-controller",
  "d2b-host",
  "d2b-process",
  "d2b-process-conformance",
  "d2b-provider",
  "d2b-provider-activation-nixos",
  "d2b-provider-audio-pipewire",
  "d2b-provider-clipboard-wayland",
  "d2b-provider-config-nixos",
  "d2b-provider-credential-entra",
  "d2b-provider-credential-managed-identity",
  "d2b-provider-credential-secret-service",
  "d2b-provider-device-gpu",
  "d2b-provider-device-security-key",
  "d2b-provider-device-tpm",
  "d2b-provider-device-usbip",
  "d2b-provider-display-wayland",
  "d2b-provider-network-local",
  "d2b-provider-notification-desktop",
  "d2b-provider-observability-otel",
  "d2b-provider-runtime-azure-container-apps",
  "d2b-provider-runtime-azure-virtual-machine",
  "d2b-provider-runtime-cloud-hypervisor",
  "d2b-provider-runtime-qemu-media",
  "d2b-provider-shell-terminal",
  "d2b-provider-supervisor",
  "d2b-provider-system-core",
  "d2b-provider-system-minijail",
  "d2b-provider-system-systemd",
  "d2b-provider-toolkit",
  "d2b-provider-transport-azure-relay",
  "d2b-provider-volume-local",
  "d2b-provider-volume-virtiofs",
  "d2b-resource-api",
  "d2b-resource-store",
  "d2b-resource-store-redb",
  "d2b-session",
  "d2b-session-unix",
  "d2b-sk-frontend",
  "d2b-telemetry",
  "d2b-zone-routing",
  "d2bd",
  "d2bd-runtime",
]

[workspace.package]
license = "Apache-2.0"

[workspace.lints.clippy]
all = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(test_root)"] }

[workspace.dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
rustix = { version = "0.38", features = ["fs", "process", "net", "pipe", "system", "pty", "termios", "stdio"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "time", "fs"] }
tokio-vsock = "0.7"
ttrpc = { version = "0.9.0", default-features = false }
unicode-normalization = "0.1"
